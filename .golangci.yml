# Visit https://golangci-lint.run/ for usage documentation
# and information on other useful linters
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  disable-all: true
  enable:
    - depguard
    - durationcheck
    - errcheck
    - copyloopvar
    - forcetypeassert
    - godot
    - gofmt
    - gosimple
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usetesting

linters-settings:
  depguard:
    rules:
      # internal/pipefy is the API layer. It must stay free of Terraform types so
      # it is testable with httptest and no Terraform harness. It may import the
      # transport it wraps and the lock registry, nothing else from the provider.
      sdk-stays-clean:
        files:
          - "**/internal/pipefy/**"
        deny:
          - pkg: github.com/hashicorp/terraform-plugin-framework
            desc: the SDK must stay free of Terraform types
          - pkg: github.com/pipefy/terraform-provider-pipefy/internal/provider/resources
            desc: the SDK must not depend on the Terraform layer
          - pkg: github.com/pipefy/terraform-provider-pipefy/internal/provider/datasources
            desc: the SDK must not depend on the Terraform layer
          - pkg: github.com/pipefy/terraform-provider-pipefy/internal/provider/conditionschema
            desc: the SDK must not depend on the Terraform layer
