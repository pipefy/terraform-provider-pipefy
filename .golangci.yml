# Visit https://golangci-lint.run/ for usage documentation
# and information on other useful linters
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  disable-all: true
  enable:
    - depguard
    - durationcheck
    - errcheck
    - copyloopvar
    - forcetypeassert
    - godot
    - gofmt
    - gosimple
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - predeclared
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usetesting

linters-settings:
  depguard:
    rules:
      # internal/pipefy is the API layer. It must stay free of Terraform so it is
      # testable with httptest and no Terraform harness. The prefix covers the
      # whole plugin surface, not just the framework, and applies to its tests
      # too: they have no reason to reach for the acceptance-test harness.
      sdk-holds-no-terraform:
        files:
          - "**/internal/pipefy/**"
        deny:
          - pkg: github.com/hashicorp/terraform-plugin-
            desc: the SDK must stay free of Terraform types
      # The SDK depends on internal/locks and nothing else in this module. Its
      # tests are the one exception: the httptest helper wires up the real
      # transport, which lives under internal/provider.
      sdk-holds-no-provider-imports:
        files:
          - "**/internal/pipefy/**"
          - "!$test"
        deny:
          - pkg: github.com/pipefy/terraform-provider-pipefy/internal/provider
            desc: the SDK must not depend on the Terraform layer
